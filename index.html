<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MODAK</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#17181c"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#17181c;--stg:#121316;--t:#eceef2;--a:#b4a7e8;--p:#22242a;--m:#9aa0ab;--r:#e0566a;--lw:250px;--dim:.55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:15px/1.4 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden}
#bgi,#dim{position:fixed;inset:0;background-size:cover;background-position:center;z-index:0}#dim{background:#000;opacity:var(--dim)}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--p);border:1px solid #8883;border-radius:10px;padding:9px 14px;cursor:pointer}
.pri{background:var(--a);color:var(--on,#111);border:0;border-radius:10px;padding:12px;width:100%;cursor:pointer;font-weight:600}
input[type=text],input:not([type]),input[type=file],select{background:#0003;border:1px solid #8884;border-radius:10px;padding:10px;width:100%}
#join{position:relative;z-index:1;max-width:380px;margin:6vh auto;padding:24px;background:var(--p);border-radius:16px;display:grid;gap:12px}
#join h1{margin:0}label{font-size:13px;color:var(--m);display:grid;gap:4px}
.av{display:flex;gap:6px;flex-wrap:wrap}.av span{font-size:24px;padding:4px 6px;border-radius:10px;cursor:pointer;border:2px solid transparent}.av span.s{border-color:var(--a)}
.ai{width:20px;height:20px;border-radius:50%;object-fit:cover;vertical-align:middle}
#app{position:relative;z-index:1;display:none;height:100%;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:14px 18px}
.logo{width:44px;height:44px;border-radius:12px;background:#fff2;display:flex;align-items:center;justify-content:center;font-size:22px}
#rn{font-size:20px;font-weight:700}.sp{flex:1}#cnt{font-size:13px}#cnt:before{content:"●";color:var(--a);margin-right:6px;font-size:10px}
.ib{background:#0006;border:1px solid #fff2;border-radius:10px;padding:9px 12px;cursor:pointer}
#note{margin:0 18px;padding:8px 12px;background:#e0566a33;color:#ff9aa8;font-size:13px;display:none;border-radius:8px}
main{flex:1;display:flex;min-height:0;gap:12px;padding:8px 18px 86px}
#tiles{width:var(--lw);flex:none;display:flex;flex-direction:column;gap:10px;overflow:auto}
.pt{background:#0007;border:1px solid #fff2;border-radius:12px;min-height:130px;position:relative;display:flex;align-items:center;justify-content:center}
.pt .c{width:64px;height:64px;border-radius:50%;background:#556;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}.pt .c img{width:100%;height:100%;object-fit:cover}
.pt .n{position:absolute;left:10px;bottom:8px;font-size:13px}.pt .mi{position:absolute;right:10px;bottom:8px;font-size:14px}
.pt.me{border-color:var(--a)}.pt.on{box-shadow:0 0 0 2px var(--g,#4cd08a)}
#stage{flex:1;background:var(--stg);border-radius:14px;display:grid;gap:8px;padding:8px;grid-auto-rows:1fr;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));overflow:auto;position:relative}
.tile{background:#000;border-radius:12px;position:relative;overflow:hidden;min-height:160px}
.tile video{width:100%;height:100%;object-fit:contain}
.tile .cap{position:absolute;left:10px;top:10px;background:#000b;color:#fff;padding:4px 12px;border-radius:14px;font-size:13px}
.tile .btnfs{position:absolute;right:8px;top:8px;background:#000a;color:#fff;border:0;border-radius:8px;padding:4px 8px;cursor:pointer}
#empty{margin:auto;color:var(--m);text-align:center;padding:20px;grid-column:1/-1}
#side{width:320px;flex:none;background:#0008;border:1px solid #fff2;border-radius:14px;display:flex;flex-direction:column}#side.h{display:none}
#sh{padding:10px;text-align:right}
#msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.m{max-width:90%}.m small{color:var(--m)}.m div{background:#fff1;padding:7px 11px;border-radius:12px;word-break:break-word}
.m.me{align-self:flex-end;text-align:right}.m.me div{background:var(--a);color:#111}
#cf{display:flex;gap:6px;padding:10px}
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;z-index:3;align-items:center}
#bar button{width:54px;height:54px;border-radius:50%;background:#0008;border:1px solid #fff3;font-size:20px;cursor:pointer}
#bar button.on{background:var(--a);color:#111}#bar .end{background:#a33a4a;border:0}
#cfg{position:fixed;right:18px;top:78px;width:340px;max-height:calc(100% - 100px);overflow:auto;background:#1d1f24f2;border:1px solid #fff2;border-radius:14px;padding:6px 16px 16px;z-index:5;display:none}
#cfg h4{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--m)}#cfg section{padding:14px 0;border-bottom:1px solid #fff1}
.sw{display:flex;gap:10px;flex-wrap:wrap}.sw i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid #fff3}.sw input{width:30px;height:30px;padding:0;border:0;background:none}
#cfg input[type=range]{width:100%;accent-color:var(--a)}
.row{display:flex;gap:8px;align-items:center}
@media(max-width:800px){#tiles{display:none}#side{position:fixed;inset:auto 0 80px 0;width:auto;height:45%;z-index:4}}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
#bar svg{width:22px;height:22px}#bar .end{background:#5a2a33;color:#ffb3bf;border:1px solid #ff8a9a55}#bar .vs{width:1px;height:30px;background:#fff3}
.logo svg{width:24px;height:24px}.ib svg{width:18px;height:18px;vertical-align:-.3em}.btnfs svg{width:16px;height:16px}.pt .mi svg{width:16px;height:16px}
.tab{position:fixed;top:50%;transform:translateY(-50%);z-index:3;background:#0008;border:1px solid #fff2;color:var(--t);padding:14px 7px;cursor:pointer;border-radius:0 10px 10px 0;left:calc(var(--lw) + 18px)}
body.nol .tab#tl{left:0}#tr{left:auto;right:0;border-radius:10px 0 0 10px;display:none}body.nor #tr{display:block}
body.nol #tiles{display:none}body.nor #side{display:none}#cft{font-size:11px;color:var(--m);text-align:center;padding:0 10px 10px}
@media(max-width:800px){#tl{display:none}}
#join h1{text-align:center;font-size:22px}
#cfg{font-size:13px}#cfg h4{font-size:12px;margin:0 0 10px;font-weight:500}#cfg .btn{font-size:13px;padding:8px 12px}
#cfg input[type=range]{display:block;width:100%;margin:6px 0 0}
#cfg .row{display:flex;gap:10px;align-items:center}#cfg .row span{flex:none;white-space:nowrap;font-size:12px;color:var(--m)}
#cfg .row input[type=range]{flex:1;width:auto;margin:0;min-width:0}
#cfg .row input:not([type]){flex:1;width:auto;min-width:0;padding:8px 10px;font-size:13px}#cfg select{padding:8px 10px;font-size:13px}
.sw input[type=color]{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;border:2px solid #fff3;padding:0;cursor:pointer;background:conic-gradient(#f66,#fd6,#6f9,#6df,#96f,#f6c,#f66)}
.sw input[type=color]::-webkit-color-swatch-wrapper,.sw input[type=color]::-webkit-color-swatch{opacity:0}.sw input[type=color]::-moz-color-swatch{opacity:0}
#pm{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
#pb{background:#25222f;border:1px solid #fff2;border-radius:18px;padding:24px;width:min(400px,100%);display:grid;gap:14px;justify-items:center}
#pb .hd{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:17px;font-weight:700}
#pc{width:220px;height:220px;border-radius:50%;border:2px solid var(--a);background:#0004}
#pb .sl{display:flex;align-items:center;gap:12px;width:100%;font-size:12px;color:var(--m)}#pb .sl span{width:32px;flex:none}#pb .sl input{flex:1;accent-color:var(--a);min-width:0}
#pb .bt{display:flex;gap:10px;width:100%}#pb .bt button{flex:1;padding:12px;border-radius:12px;border:1px solid #fff2;background:none;cursor:pointer;font-weight:600}#pb .bt .ok{background:var(--a);color:var(--on,#111);border:0}
.pt .c{cursor:default}
#bar button{color:#ffe9c9;border:1px solid #fff3}#bar button.on{color:var(--on,#111)}#bar .end{background:#7a3b45;color:#ffc6cf;border:1px solid #ff8a9a44}
#bar svg{width:22px;height:22px;stroke-width:1.8}
.m{max-width:92%;align-self:flex-start}.m .mh{background:none;padding:0;font-size:12px;margin:0 0 4px 2px;display:flex;gap:8px;align-items:baseline}
.m .mh b{color:var(--t);font-weight:600}.m .mh span{color:var(--m)}
.m .mb{background:#2e2e32;padding:12px 16px;border-radius:14px;word-break:break-word;color:var(--t);font-size:15px;line-height:1.45;width:fit-content}
.m.me{align-self:flex-end}.m.me .mh{justify-content:flex-end;background:none;color:var(--t);padding:0}.m.me .mb{background:#3a3850;color:var(--t);margin-left:auto}
#side{background:#14151a}#sh{padding:10px 14px;border:0}
#cf{position:relative;display:block;margin:10px 12px 6px;padding:0}#cf input{border-radius:14px;padding:13px 54px 13px 14px}
#cf button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#4a4658;border-radius:10px;padding:8px 10px}
#stage{display:flex;flex-direction:column;gap:8px}#stage .tile:not(.sub){flex:1;min-height:0}
#subs{display:none;gap:8px;overflow-x:auto;flex:none;height:118px}
.tile.sub{width:200px;min-height:0;flex:none;cursor:pointer;border:1px solid #fff3}.tile.sub .btnfs{display:none}.tile.sub .cap{font-size:11px;padding:2px 8px}
#stage .tile{flex:1;min-height:0}#stage #mt{display:block}
.pt .th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px;background:#000}
.pt .n,.pt .mi{z-index:1;text-shadow:0 1px 3px #000}.pt.sel{border-color:var(--a);box-shadow:0 0 0 2px var(--a)}
:root{--sbp:30%}
*{scrollbar-width:thin;scrollbar-color:transparent transparent}
*:hover{scrollbar-color:color-mix(in srgb,var(--t) var(--sbp),transparent) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-corner,::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background-color:transparent;border-radius:8px;border:2px solid transparent;background-clip:padding-box;transition:background-color .2s}
*:hover::-webkit-scrollbar-thumb{background-color:color-mix(in srgb,var(--t) var(--sbp),transparent)}
*::-webkit-scrollbar-thumb:hover{background-color:color-mix(in srgb,var(--t) calc(var(--sbp) + 18%),transparent)}
.dd{position:relative;width:100%}
.ddb{width:100%;display:flex;justify-content:space-between;align-items:center;background:color-mix(in srgb,var(--t) 8%,transparent);border:1px solid #fff2;border-radius:12px;padding:9px 12px;cursor:pointer;font-size:13px;color:var(--t)}
.ddl{position:absolute;left:0;right:0;bottom:calc(100% + 6px);max-height:210px;overflow:auto;background:#1d1f24ee;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid #fff2;border-radius:12px;padding:5px;display:none;z-index:6;box-shadow:0 10px 30px #0008}
.dd.open .ddl{display:block}.ddl div{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--t)}
.ddl div:hover{background:color-mix(in srgb,var(--t) 10%,transparent)}.ddl div.s{background:color-mix(in srgb,var(--a) 28%,transparent)}
#sh{display:flex;justify-content:flex-end;gap:8px}.m.div{align-self:center;font-size:11px;color:var(--m)}
.m.div{align-self:center;background:#fff1;padding:3px 14px;border-radius:12px;margin:6px 0}
.m .mb{background:color-mix(in srgb,var(--a) 10%,#2a2a2e)}
.m.me .mb{background:var(--a);color:var(--on,#15161a)}
</style></head><body>
<div id="bgi"></div><div id="dim"></div>
<div id="join">
  <h1>MODAK</h1>
  <label>방 코드 (비밀)<input id="rc" maxlength="30" autocomplete="off"></label>
  <div style="display:flex;gap:8px;margin-top:-4px"><button class="btn" id="rg" type="button" style="font-size:13px;padding:7px 12px">새 코드 만들기</button><button class="btn" id="rl" type="button" style="font-size:13px;padding:7px 12px">초대 링크 복사</button></div><div id="rh" style="font-size:12px;color:var(--m);margin-top:-4px"></div>
  <div id="jnew" style="display:grid;gap:12px"><label>방 이름 (선택)<input id="jrn" maxlength="20" placeholder="MODAK"></label>
  <label>최대 인원 <b id="jml" style="color:var(--t);font-weight:600">10명</b><input type="range" id="jmx" min="2" max="10" value="10" style="padding:0;accent-color:var(--a)"></label></div>
  <div style="display:grid;justify-items:center;gap:6px;margin:4px 0"><div id="pv" title="눌러서 사진 선택" style="width:84px;height:84px;border-radius:50%;background:#0004;border:1px solid #fff3;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;color:var(--m)"></div><span style="font-size:12px;color:var(--m)">프로필 사진 (눌러서 선택)</span><input type="file" id="pf" accept="image/*" hidden></div>
  <label>닉네임<input id="nn" maxlength="12" placeholder="닉네임"></label>
  <button class="pri" id="go">들어가기 →</button>
  <div id="jerr" style="color:#ff9aa8;font-size:13px"></div>
  <div style="font-size:12px;color:var(--m)">마이크는 입장 후 버튼으로 켜요. 같은 방 코드를 쓰는 사람끼리 만나요.</div>
</div>
<div id="pm"><div id="pb"><div class="hd"><span>프로필 사진 조절</span><button class="ib" id="pxx" data-i="x"></button></div>
  <canvas id="pc"></canvas><button class="ib" id="pother">다른 사진 선택</button>
  <label class="sl"><span>확대</span><input type="range" id="pz" min="100" max="300" value="100"></label>
  <label class="sl"><span>좌우</span><input type="range" id="px" min="-100" max="100" value="0"></label>
  <label class="sl"><span>상하</span><input type="range" id="py" min="-100" max="100" value="0"></label>
  <div class="bt"><button id="pcn">취소</button><button class="ok" id="psv">프로필 저장</button></div></div></div>
<div id="app">
  <header><div class="logo" data-i="flame"></div><span id="rn">MODAK</span><span class="sp"></span><span id="cnt"></span>
    <button class="ib" id="bcfg" data-i="menu"></button><button class="ib" id="bcode"><span data-i="copy"></span> 초대 링크</button></header>
  <div id="note"></div>
  <main><div id="tiles"></div>
  <div id="stage"><div id="empty">아직 공유 중인 화면이 없어요.<br>아래 화면공유 버튼을 눌러 시작해요.</div><div class="tile" id="mt" style="display:none"><video autoplay playsinline></video><span class="cap"></span><button class="btnfs"></button></div></div>
  <aside id="side"><div id="sh"><button class="ib" id="bx" data-i="chevR"></button></div><div id="msgs"></div>
    <div id="cf"><input id="ci" placeholder="메시지 보내기…" maxlength="500"><button class="btn" id="cs" data-i="up"></button></div><div id="cft">Enter로 보내기 · 채팅을 접어도 대화는 남아요</div></aside></main>
  <button class="tab" id="tl"></button><button class="tab" id="tr"></button>
  <div id="bar"><button id="bm" title="마이크"></button><button id="bs" title="화면·소리 공유"></button><button id="bc" title="채팅"></button><span class="vs"></span><button class="end" id="be" title="나가기"></button></div>
  <div id="audios"></div>
  <div id="cfg">
   <section><h4>프로필</h4><button class="btn" id="bp">프로필 사진 변경</button></section>
   <section><h4>포인트 색상</h4><div class="sw" data-v="--a"></div></section>
   <section><h4>화면 공유 흐림</h4><button class="btn" id="bb" style="width:100%">흐림 꺼짐</button><div class="row" style="margin-top:8px"><span style="font-size:13px">농도</span><input type="range" id="bl" min="2" max="40" value="24"></div><div style="font-size:12px;color:var(--m)">공유를 시작하면 다른 사람 화면에도 적용돼요</div></section>
   <section><h4>스크롤바 투명도</h4><input type="range" id="sbo" min="10" max="80" value="30"></section>
   <section><h4>좌측 참가자창 크기</h4><input type="range" id="lw" min="150" max="360" value="250"></section>
   <section><h4>배경 색상</h4><div class="sw" data-v="--bg"></div></section>
   <section><h4>화면 영역 색상</h4><div class="sw" data-v="--stg"></div></section>
   <section><h4>글자 색상</h4><div class="sw" data-v="--t"></div></section>
   <section><h4>배경 이미지</h4><div class="row"><input id="bu" placeholder="이미지 링크 붙여넣기"><button class="btn" id="ba">적용</button></div>
     <div class="row" style="margin-top:8px"><button class="btn" id="bf">이미지 추가</button><button class="btn" id="br">제거</button><input type="file" id="bfi" accept="image/*" hidden></div>
     <div class="row" style="margin-top:12px"><span style="font-size:13px">배경 어둡기</span><input type="range" id="bd" min="0" max="90" value="55"></div></section>
   <section><h4>현재 방 최대 인원</h4><div class="row"><div class="dd" id="mx"><button class="ddb" type="button">10명<span data-i="chevD"></span></button><div class="ddl"></div></div></div></section>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>

let P,conns={},pending={},pmap={},seen={},hd={},ph=null,calls={},base="",pres={name:"",av:"",mic:false,share:false,blur:0};
const slotOf=id=>parseInt(id.split("s").pop());
room={
  emit(t,d){Object.values(conns).forEach(c=>c.open&&c.send({t,d}));hd[t]&&hd[t]({data:d,peer:me,sameTab:true})},
  on(t,f){hd[t]=f},
  presence(p){for(const k in p){if(p[k]===null)delete pres[k];else pres[k]=p[k]}pmap[me]=pres;Object.values(conns).forEach(c=>c.open&&c.send({t:"pr",d:pres}));fire([],[])},
  peers(){return[{peer:me,sameTab:true,presence:pres},...Object.keys(conns).filter(i=>pmap[i]).map(i=>({peer:i,sameTab:false,presence:pmap[i]}))]},
  onPeers(f){ph=f}};
function fire(j,l){if(ph)ph({peers:room.peers(),joined:j,left:l,updated:[]})}
function setup(c){
  c.on("open",()=>{conns[c.peer]=c;seen[c.peer]=Date.now();
    if(Object.keys(conns).filter(i=>i!==c.peer).length+1>=maxN){delete conns[c.peer];c.send({t:"full"});setTimeout(()=>{try{c.close()}catch(e){}},400);return}c.send({t:"pr",d:pres});c.send({t:"hist",d:hist.slice(-300)});shareImg();if(cfgv)c.send({t:"cfg",d:cfgv});
    if(mic)callTo(c.peer,mic,"mic");if(scr)callTo(c.peer,scr,"scr")});
  c.on("data",m=>{if(!m||!m.t)return;seen[c.peer]=Date.now();
    if(m.t==="pr"){const o=pmap[c.peer],n=!o,ch=n||JSON.stringify(o)!==JSON.stringify(m.d);pmap[c.peer]=m.d;if(ch)fire(n?[{peer:c.peer,presence:m.d}]:[],[])}
    else hd[m.t]&&hd[m.t]({data:m.d,peer:c.peer,sameTab:false})});
  const gone=()=>{if(conns[c.peer]!==c&&conns[c.peer])return;delete conns[c.peer];delete pmap[c.peer];drop(c.peer);fire([],[{peer:c.peer}])};
  c.on("close",gone);c.on("error",gone)}
function claim(n,name){
  if(n>10){$("jerr").textContent="방이 가득 찼어요 (최대 10명).";$("go").disabled=false;return}
  const p=new Peer(base+n);P=p;
  p.on("open",id=>{me=id;pmap[me]=pres;
    $("join").style.display="none";$("app").style.display="flex";
    room.on("chat",m=>merge([m.data]));room.on("hist",m=>merge(m.data));loadChat();
    room.on("avt",m=>{if(m.data&&typeof m.data.img==="string"&&m.data.img.startsWith("data:image/")){if(avs[m.peer]!==m.data.img){avs[m.peer]=m.data.img;fire([],[])}}});
    room.on("cfg",m=>{const d=m.data;if(d&&d.max&&(!cfgv||d.ts>cfgv.ts))setCfg(Math.min(10,Math.max(2,+d.max)),String(d.rn||"MODAK").slice(0,20),+d.ts||0)});
    room.on("full",()=>{try{sessionStorage.setItem("modak_full","1")}catch(e){}location.reload()});
    room.onPeers(onPeers);room.presence({name,av,mic:false,share:false});if(creatorMode)setCfg(jcfg[0],jcfg[1],Date.now());shareImg();setInterval(shareImg,15000);
    p.on("connection",setup);
    p.on("call",c=>{c.answer();const ty=c.metadata&&c.metadata.ty;
      c.on("stream",st=>gotStream(c.peer,ty,st));c.on("close",()=>rmRemote(c.peer,ty))});
    const scan=()=>{for(let k=1;k<n;k++){const id=base+k;if(!conns[id]&&!pending[id]){pending[id]=1;setTimeout(()=>delete pending[id],6000);setup(p.connect(id,{reliable:true}))}}};
    scan();setInterval(scan,4000);setInterval(()=>{const now=Date.now();Object.keys(conns).forEach(id=>{const c=conns[id];if(c.open)c.send({t:"pr",d:pres});if(seen[id]&&now-seen[id]>40000){try{c.close()}catch(e){}}})},10000)});
  p.on("error",e=>{if(e.type==="unavailable-id"){p.destroy();claim(n+1,name)}else if(e.type!=="peer-unavailable"){$("jerr").textContent="연결 오류: "+e.type;$("go").disabled=false}});
  p.on("disconnected",()=>{try{p.reconnect()}catch(e){}})}
$("go").onclick=()=>{
  const code=$("rc").value.trim()||(()=>{const c=rcode();$("rc").value=c;return c})(),name=$("nn").value.trim()||"익명",er=$("jerr");
  if(typeof Peer==="undefined"){er.textContent="PeerJS를 불러오지 못했어요. 인터넷 연결을 확인하세요.";return}
  creatorMode=$("jnew").style.display!=="none";jcfg=[+$("jmx").value,($("jrn").value.trim()||"MODAK").slice(0,20)];er.textContent="연결 중…";$("go").disabled=true;try{localStorage.setItem("modak_nn",name)}catch(e){}av=(name[0]||"?");
  base="wr"+(c=>{let a=5381,b=52711;for(const ch of c.trim().toLowerCase()){const k=ch.codePointAt(0);a=((a*33)^k)|0;b=((b*31)^k)|0}return(a>>>0).toString(36)+(b>>>0).toString(36)})(code)+"s";if(/^[a-z0-9]{6,40}$/.test(code.trim().toLowerCase()))base="wr"+code.trim().toLowerCase()+"s";
  claim(1,name)};
function self(){return(room.peers().find(p=>p.sameTab)||{}).peer}

function setCfg(max,rn,ts){cfgv={max,rn,ts};maxN=max;$("mx").value=max;$("rn").textContent=rn;room.emit("cfg",cfgv);fire([],[])}
const tmap={};
function onPeers(c){
  me=self();const ps=c.peers;
  $("cnt").textContent=ps.length+" / "+maxN+" 접속 중";
  const box=$("tiles"),ids=new Set();
  ps.forEach(p=>{const id=p.peer,pr=p.presence;ids.add(id);names[id]=pr;
    let t=tmap[id];

      t.innerHTML='<div class="c"></div><span class="n"></span><span class="mi"></span>';

    t.classList.toggle("me",!!p.sameTab);
    const ci=t.querySelector(".c"),key=(avs[id]||"")+"|"+(pr.av||"");
    if(t._k!==key){t._k=key;ci.innerHTML="";if(avs[id]){const i=document.createElement("img");i.src=avs[id];ci.appendChild(i)}else ci.textContent=pr.av||"?"}

    const mi=t.querySelector(".mi"),mk=pr.mic?"1":"0";if(mi._m!==mk){mi._m=mk;mi.innerHTML=ic(pr.mic?"mic":"micoff")}
    let v=t.querySelector("video.th");
    if(streams[id]){if(!v){v=document.createElement("video");v.muted=true;v.autoplay=true;v.playsInline=true;v.className="th";t.prepend(v)}
      if(v.srcObject!==streams[id]){v.srcObject=streams[id];v.play().catch(()=>{})}ci.style.display="none";t.style.cursor="pointer"}
    else{if(v)v.remove();ci.style.display="";t.style.cursor=id===me?"pointer":""}});
  Object.keys(tmap).forEach(id=>{if(!ids.has(id)){tmap[id].remove();delete tmap[id]}});
  const order=ps.map(p=>p.peer);if([...box.children].map(e=>e.dataset.id).join()!==order.join())order.forEach(id=>box.appendChild(tmap[id]));
  if(c.joined.some(p=>!p.sameTab))shareImg();
  c.left.forEach(p=>drop(p.peer));

}
function rmRemote(id,ty){if(ty==="mic"){document.querySelectorAll("#a"+id).forEach(e=>e.remove());return}delete streams[id];render();fire([],[])}
function drop(id){rmRemote(id,"mic");rmRemote(id,"scr");["mic","scr"].forEach(t=>{if(calls[id+t]){try{calls[id+t].close()}catch(e){}delete calls[id+t]}})}
let sel=null,curS=null;const streams={};
function render(){const ids=Object.keys(streams);const id=streams[sel]?sel:(ids.find(i=>i!==me)||ids[0]);
  const mt=$("mt"),v=mt.querySelector("video"),st=id?streams[id]:null;
  $("empty").style.display=st?"none":"";mt.style.display=st?"block":"none";
  document.querySelectorAll(".pt").forEach(t=>t.classList.toggle("sel",!!st&&t.dataset.id===id));
  if(!st){v.srcObject=null;curS=null;return}
  if(curS!==st){curS=st;v.srcObject=st;v.muted=(id===me);v.play().catch(()=>{v.muted=true;v.play().catch(()=>{})})}
  const p=names[id]||pres,bl=id===me?(blurOn?+$("bl").value:0):(p.blur||0);
  mt.querySelector(".cap").textContent=id===me?"내 화면":(p.name||"")+"의 화면";v.style.filter=bl?"blur("+bl+"px)":""}

function callTo(id,st,ty){const k=id+ty;if(calls[k])try{calls[k].close()}catch(e){}calls[k]=P.call(id,st,{metadata:{ty}})}

function rmAll(st){const ty=st===mic?"mic":"scr";Object.keys(calls).filter(k=>k.endsWith(ty)).forEach(k=>{try{calls[k].close()}catch(e){}delete calls[k]})}
function gotStream(id,ty,st){
  if(ty==="mic"){let a=document.getElementById("a"+id);if(!a){a=document.createElement("audio");a.id="a"+id;a.autoplay=true;$("audios").appendChild(a)}a.srcObject=st;a.play().catch(()=>{});return}
  if(streams[id]&&streams[id].id===st.id)return;streams[id]=st;render();fire([],[])}

$("bm").onclick=async()=>{
  if(mic){rmAll(mic);mic.getTracks().forEach(t=>t.stop());mic=null;$("bm").className="";$("mt").querySelector(".btnfs").innerHTML=ic("expand");$("mt").querySelector(".btnfs").onclick=()=>$("mt").requestFullscreen&&$("mt").requestFullscreen();
$("bm").innerHTML=ic("micoff");room.presence({mic:false});return}
  try{mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    addAll(mic);$("bm").className="on";$("bm").innerHTML=ic("mic");room.presence({mic:true});note("")}
  catch(e){mic=null;note("마이크를 쓸 수 없어요: 이 페이지에서 마이크 권한이 막혀 있을 수 있어요 ("+(e.name||e)+"). 브라우저 주소창의 권한 설정을 확인하거나, 파일로 내려받아 직접 호스팅해 열어보세요.")}};

$("bs").onclick=async()=>{
  if(scr){stopShare();return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia){note("이 브라우저는 화면 공유를 지원하지 않아요. (모바일 브라우저는 대부분 불가능해요. PC의 Chrome/Edge를 쓰세요.)");return}
  try{scr=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:15},audio:true});
    addAll(scr);$("bs").className="on";$("bs").innerHTML=ic("screen");room.presence({share:true,blur:blurOn?+$("bl").value:0});note("");

  catch(e){scr=null;note(e.name==="NotAllowedError"?"":"화면 공유 오류: "+(e.message||e))}};

  $("bs").className="";$("bs").innerHTML=ic("screenoff");room.presence({share:false});delete streams[me];render();fire([],[])}

    const e=document.createElement("div");e.className="m"+(m.u===myUid?" me":"");
    const h=document.createElement("div");h.className="mh";const n=document.createElement("b");n.textContent=m.n;const t=document.createElement("span");t.textContent=dt.toTimeString().slice(0,5);h.append(n,t);
    const x=document.createElement("div");x.className="mb";x.textContent=m.t;e.append(h,x);box.appendChild(e)});

function merge(list){if(!Array.isArray(list))list=[list];const ids=new Set(hist.map(m=>m.id));let ch=false;
  list.forEach(m=>{if(m&&m.id&&typeof m.t==="string"&&!ids.has(m.id)){hist.push({id:String(m.id),ts:+m.ts||Date.now(),u:String(m.u||""),n:String(m.n||"").slice(0,20),t:m.t.slice(0,500)});ids.add(m.id);ch=true}});
  if(ch){hist.sort((a,b)=>a.ts-b.ts);hist=hist.slice(-500);hsave();renderChat()}}
